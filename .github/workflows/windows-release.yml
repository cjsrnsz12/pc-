name: Build Windows App
on:
  push:
    branches: [main]
    paths: ['version.py', '.github/workflows/windows-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pyinstaller==6.16.0 pefile
      - name: Test state handling and rollback
        run: python -m pytest -q
      - name: Build no-console EXE
        run: python build_windows.py
      - name: Validate GUI executable
        shell: pwsh
        run: |
          python -c "import pefile; p=pefile.PE('dist/AbyssHelper.exe'); assert p.OPTIONAL_HEADER.Subsystem==2, 'Console subsystem is forbidden'"
          $report = Join-Path $env:RUNNER_TEMP 'abyss-smoke.json'
          $exe = Join-Path $pwd 'dist/AbyssHelper.exe'
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoke-test','--report', $report) -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw 'EXE startup timed out' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'EXE startup failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.templates -lt 20) { throw 'Invalid smoke test result' }
          Get-Content $report
      - name: Validate automatic replacement and restart
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'abyss-updater-test.json'
          $exe = Join-Path $pwd 'dist/AbyssHelper.exe'
          $p = Start-Process -FilePath $exe -ArgumentList @('--updater-self-test','--report', $report) -PassThru
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; throw 'Updater integration test timed out' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) { if (Test-Path $report) { Get-Content $report }; throw 'Automatic update test failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Replacement/restart did not complete' }
          Get-Content $report
      - name: Keep build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbyssHelper-Windows
          path: dist/AbyssHelper.exe
          retention-days: 30
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; kept unchanged."; exit 0 }
          gh release create $tag dist/AbyssHelper.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "어비스 헬퍼 PC $tag" --notes-file CHANGELOG.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
